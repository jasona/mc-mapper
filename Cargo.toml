[workspace]
resolver = "3"
members = [
    "crates/mcmap-data",
    "crates/mcmap-worldgen",
    "crates/mcmap-tiles",
    "crates/mcmap-live",
    "crates/mcmap-app",
    "crates/mcmap-cli",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.1"
publish = false

[workspace.dependencies]
mcmap-data = { path = "crates/mcmap-data" }
mcmap-worldgen = { path = "crates/mcmap-worldgen" }
mcmap-tiles = { path = "crates/mcmap-tiles" }
mcmap-live = { path = "crates/mcmap-live" }
# Rune is pre-release and only `mcmap-app` may depend on it. Bump the rev deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "2bc3179d08355a8bb08fa54b9025780fe848b8f6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
postcard = { version = "1", features = ["use-std"] }
clap = { version = "4", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 2
